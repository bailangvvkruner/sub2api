[package]
name = "sub2api-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
async-trait = "0.1"
aws-lc-rs = { version = "1.17", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm", "ring-io"] }
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio", "ws"] }
base64 = "0.22"
blowfish = { version = "0.9", features = ["bcrypt"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
data-encoding = "2"
futures-util = "0.3"
flate2 = "1.1.9"
hex = "0.4"
hmac = "0.12"
include_dir = "0.7"
ipnet = "2"
mime-infer = "4"
md-5 = "0.10"
parking_lot = "0.12"
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "query", "rustls", "socks", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
pkcs8 = "0.10"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
