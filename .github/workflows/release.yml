name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sub2api
          POSTGRES_PASSWORD: sub2api-test
          POSTGRES_DB: sub2api_rust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sub2api -d sub2api_rust_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sub2api:sub2api-test@127.0.0.1:5432/sub2api_rust_test?sslmode=disable
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify Rust and frontend
        run: |
          make test-rust
          pnpm --dir frontend run lint:check
          pnpm --dir frontend run typecheck
          pnpm --dir frontend run test:run
          pnpm --dir frontend run build

      - name: Verify route coverage
        working-directory: backend-rust
        run: |
          cargo run --example route_coverage --locked | tee route-coverage.tsv
          grep -q $'SUMMARY\t.*intentional_absence=1\tmissing=0' route-coverage.tsv

      - name: Verify PostgreSQL integration contracts
        run: make test-rust-integration

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        working-directory: backend-rust
        run: cargo audit --deny warnings

  container:
    name: Publish Rust container
    runs-on: ubuntu-latest
    needs: verify
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          release_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          version="${tag#v}"
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build_version=${version}+${release_sha}" >>"$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${owner}/${repository}" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Rust image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.ghcr }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.ghcr }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.ghcr }}:latest
          build-args: |
            SUB2API_BUILD_VERSION=${{ steps.release.outputs.build_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Mirror release image to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          SOURCE_IMAGE: ${{ steps.release.outputs.ghcr }}
          TARGET_IMAGE: ${{ env.DOCKERHUB_USERNAME }}/sub2api
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools create --tag "${TARGET_IMAGE}:${VERSION}" "${SOURCE_IMAGE}:${VERSION}"
          docker buildx imagetools create --tag "${TARGET_IMAGE}:${TAG}" "${SOURCE_IMAGE}:${VERSION}"
          docker buildx imagetools create --tag "${TARGET_IMAGE}:rust" "${SOURCE_IMAGE}:${VERSION}"
          docker buildx imagetools create --tag "${TARGET_IMAGE}:latest" "${SOURCE_IMAGE}:${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
