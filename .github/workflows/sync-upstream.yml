name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Wei-Shaw/sub2api.git
          else
            git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          fi
          git fetch upstream main

      - name: Merge upstream and preserve fork patch
        id: merge
        run: |
          bash .github/scripts/merge-upstream.sh upstream/main

      - name: Regenerate dependency injection
        if: steps.merge.outputs.changed == 'true'
        working-directory: backend
        run: |
          go generate ./cmd/server
          git add cmd/server/wire_gen.go

      - name: Verify fork patch is still applied
        if: steps.merge.outputs.changed == 'true'
        run: |
          bash .github/scripts/verify-fork-hotpath.sh

      - name: Run focused backend tests
        if: steps.merge.outputs.changed == 'true'
        working-directory: backend
        env:
          GOCACHE: ${{ github.workspace }}/.tmp/go-build-cache
          GOTMPDIR: ${{ github.workspace }}/.tmp/go-tmp
        run: |
          mkdir -p "$GOCACHE" "$GOTMPDIR"
          trap 'rm -rf "$GOCACHE" "$GOTMPDIR"' EXIT
          go test ./internal/repository ./internal/service ./internal/handler ./internal/server

      - name: Commit synchronized tree
        if: steps.merge.outputs.changed == 'true'
        run: |
          git diff --check
          git diff --cached --check
          git commit -m "Merge upstream/main into main"
          git merge-base --is-ancestor upstream/main HEAD

      - name: Set image metadata
        if: steps.merge.outputs.changed == 'true'
        run: |
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/sub2api" >> "$GITHUB_ENV"
          BASE_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          echo "APP_VERSION=${BASE_VERSION}-vmain" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.merge.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.merge.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ env.APP_VERSION }}
            COMMIT=${{ env.HEAD_SHA }}
          no-cache: true

      - name: Log in to Docker Hub
        if: steps.merge.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push synced main
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Push Docker image
        if: steps.merge.outputs.changed == 'true'
        run: |
          docker push "${IMAGE_NAME}:latest"
