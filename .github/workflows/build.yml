name: Docker Hub Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dockerhub-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api

jobs:
  build-and-push:
    name: Publish immutable image then latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        run: |
          base_version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          echo "APP_VERSION=${base_version}-vmain" >>"$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >>"$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable SHA tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.APP_VERSION }}
            COMMIT=${{ github.sha }}
          no-cache: true

      - name: Promote merged main image to latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:latest" \
            "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
