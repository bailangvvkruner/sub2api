# Rust application only. PostgreSQL must be supplied externally.
services:
  sub2api:
    image: ${SUB2API_RUST_IMAGE:-sub2api-rust:local}
    build:
      context: ${SUB2API_SOURCE_DIR:-..}
      dockerfile: Dockerfile
      args:
        SUB2API_BUILD_VERSION: ${SUB2API_BUILD_VERSION:-development}
    container_name: sub2api
    init: true
    restart: unless-stopped
    stop_grace_period: 180s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUN_MODE: ${RUN_MODE:-standard}
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      SETUP_CONFIG_OVERRIDES_ENV: ${SETUP_CONFIG_OVERRIDES_ENV:-true}
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST is required}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-sub2api}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_DBNAME: ${DATABASE_DBNAME:-sub2api}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-1}
      MIGRATIONS_MODE: apply
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GATEWAY_MAX_BODY_SIZE: ${GATEWAY_MAX_BODY_SIZE:-268435456}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      PRICING_DATA_FILE: /app/data/model_prices_and_context_window.json
      BACKUP_MAX_RESTORE_BYTES: ${BACKUP_MAX_RESTORE_BYTES:-68719476736}
      PRICING_REMOTE_URL: ${PRICING_REMOTE_URL:-https://raw.githubusercontent.com/Wei-Shaw/model-price-repo/main/model_prices_and_context_window.json}
      PRICING_HASH_URL: ${PRICING_HASH_URL:-https://raw.githubusercontent.com/Wei-Shaw/model-price-repo/main/model_prices_and_context_window.sha256}
      PRICING_ALLOWED_HOSTS: ${PRICING_ALLOWED_HOSTS:-raw.githubusercontent.com}
      SUB2API_REDEPLOY_COMMAND: ${SUB2API_REDEPLOY_COMMAND:-}
      SUB2API_BUILD_VERSION: ${SUB2API_BUILD_VERSION:-development}
      SUB2API_RUST_BRANCH: ${SUB2API_RUST_BRANCH:-main}
      SUB2API_RUST_ROLLBACK_REFS: ${SUB2API_RUST_ROLLBACK_REFS:-}
      RUST_LOG: ${RUST_LOG:-sub2api_rust=info,tower_http=info}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    volumes:
      - sub2api_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  sub2api_data:
